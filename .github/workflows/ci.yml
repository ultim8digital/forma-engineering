name: Validate FORMA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix worker-node/js ci
      - run: npx tsc --noEmit
      - run: npm run build

  engineering:
    name: CAD and numerical benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker-node/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libgl1
      - run: python -m pip install -r worker-node/requirements.txt
      - run: python -m pytest tests/test_cad.py tests/test_engineering.py -q
