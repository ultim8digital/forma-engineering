name: Validate FORMA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:local

  engineering:
    name: CAD and numerical benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker-node/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libgl1
      - run: python -m pip install -r worker-node/requirements.txt
      - run: python -m pytest tests/test_cad.py tests/test_engineering.py tests/test_providers.py -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m venv .venv --system-site-packages
      - name: Real local CAD and engineering flow without an account or model
        shell: bash
        run: |
          export FORMA_DATA_DIR="$RUNNER_TEMP/forma-data"
          node dist/server/index.js > "$RUNNER_TEMP/forma-local.log" 2>&1 &
          forma_pid=$!
          trap 'kill "$forma_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/api/models > /dev/null; then break; fi
            sleep 1
          done
          .venv/bin/python tests/exercise_engineering_api.py --url http://127.0.0.1:5173
